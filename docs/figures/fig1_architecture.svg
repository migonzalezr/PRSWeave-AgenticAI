<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Helvetica,Arial,sans-serif" font-size="12">
<rect width="900" height="560" fill="white"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker></defs>
<text x="20" y="24" font-size="15" font-weight="bold">Figure 1. PRSWeave Stage 3 architecture (as implemented)</text>
<rect x="20" y="60" width="130" height="50" rx="8" fill="#fff2cc" stroke="#333"/><text x="85.0" y="81.0" text-anchor="middle" font-weight="bold">Researcher</text><text x="85.0" y="97.0" text-anchor="middle" font-size="10">request text only</text>
<rect x="200" y="60" width="170" height="50" rx="8" fill="#fff2cc" stroke="#333"/><text x="285.0" y="81.0" text-anchor="middle" font-weight="bold">Claude Code relay</text><text x="285.0" y="97.0" text-anchor="middle" font-size="10">pastes packets verbatim</text>
<rect x="420" y="50" width="190" height="70" rx="8" fill="#cfe2ff" stroke="#333"/><text x="515.0" y="81.0" text-anchor="middle" font-weight="bold">Planner</text><text x="515.0" y="97.0" text-anchor="middle" font-size="10">Claude subagent (Sonnet)</text>
<rect x="660" y="60" width="180" height="50" rx="8" fill="#e2f0d9" stroke="#333"/><text x="750.0" y="81.0" text-anchor="middle" font-weight="bold">Controller</text><text x="750.0" y="97.0" text-anchor="middle" font-size="10">state machine + rules</text>
<rect x="560" y="180" width="150" height="50" rx="8" fill="#e2f0d9" stroke="#333"/><text x="635.0" y="201.0" text-anchor="middle" font-weight="bold">Evidence Retrieval</text><text x="635.0" y="217.0" text-anchor="middle" font-size="10">deterministic</text>
<rect x="720" y="180" width="150" height="50" rx="8" fill="#e2f0d9" stroke="#333"/><text x="795.0" y="201.0" text-anchor="middle" font-weight="bold">Population Context</text><text x="795.0" y="217.0" text-anchor="middle" font-size="10">deterministic</text>
<rect x="400" y="180" width="150" height="50" rx="8" fill="#e2f0d9" stroke="#333"/><text x="475.0" y="201.0" text-anchor="middle" font-weight="bold">PRS Methods</text><text x="475.0" y="217.0" text-anchor="middle" font-size="10">deterministic</text>
<rect x="420" y="300" width="330" height="50" rx="8" fill="#e2f0d9" stroke="#333"/><text x="585.0" y="321.0" text-anchor="middle" font-weight="bold">Tool registry: 10 tools</text><text x="585.0" y="337.0" text-anchor="middle" font-size="10">Stage 2 scorer, repair, regenerate, catalog cache</text>
<rect x="80" y="300" width="200" height="60" rx="8" fill="#e2f0d9" stroke="#333"/><text x="180.0" y="326.0" text-anchor="middle" font-weight="bold">Validation Critic</text><text x="180.0" y="342.0" text-anchor="middle" font-size="10">deterministic; independent scorer</text>
<rect x="80" y="420" width="200" height="50" rx="8" fill="#e2f0d9" stroke="#333"/><text x="180.0" y="441.0" text-anchor="middle" font-weight="bold">Final report / release</text><text x="180.0" y="457.0" text-anchor="middle" font-size="10">only on Critic PASS</text>
<rect x="420" y="420" width="330" height="50" rx="8" fill="#e2f0d9" stroke="#333"/><text x="585.0" y="441.0" text-anchor="middle" font-weight="bold">Append-only hash-chained event log</text><text x="585.0" y="457.0" text-anchor="middle" font-size="10">every decision, rule, tool call, verdict</text>
<line x1="150" y1="85" x2="200" y2="85" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="370" y1="85" x2="420" y2="85" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="610" y1="85" x2="660" y2="85" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="750" y1="110" x2="640" y2="180" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="750" y1="110" x2="795" y2="180" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="750" y1="110" x2="475" y2="180" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="475" y1="230" x2="520" y2="300" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="635" y1="230" x2="600" y2="300" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="795" y1="230" x2="680" y2="300" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="660" y1="100" x2="280" y2="320" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="180" y1="360" x2="180" y2="420" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="150" y1="300" x2="470" y2="120" stroke="#333" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="5,4"/>
<text x="250" y="230" font-size="10" fill="#a00">FAIL / INCONCLUSIVE feedback</text>
<line x1="585" y1="350" x2="585" y2="420" stroke="#333" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="5,4"/>
<rect x="20" y="500" width="14" height="14" fill="#cfe2ff" stroke="#333"/><text x="40" y="512">model-driven</text>
<rect x="150" y="500" width="14" height="14" fill="#e2f0d9" stroke="#333"/><text x="170" y="512">deterministic code</text>
<rect x="310" y="500" width="14" height="14" fill="#fff2cc" stroke="#333"/><text x="330" y="512">human / relay</text>
<text x="20" y="540" font-size="10">Not implemented: Bedrock or any cloud runtime; direct model API calls from Python; human approval inside a run (REQUIRES_HUMAN_REVIEW is terminal).</text>
</svg>
