[project]
name = "prsweave"
version = "0.1.0.dev0"
description = "PRSWeave: Adaptive Multi-Agent Orchestration for Polygenic Risk Research (v0.1 research prototype)"
license = {text = "MIT"}
authors = [{name = "Center for Biomedical Informatics and Genomics (CBG), Tulane University"}]
readme = "README.md"
requires-python = ">=3.10"
# Stage 1 is standard library only. Dependencies are added per stage, with approval.
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
